[package]
name = "choiterm-desktop"
version = "0.9.0"
description = "ChoiTerm PC 프로그램"
authors = ["choidevhi"]
edition = "2024"
license = "MIT"

[lib]
name = "choiterm_desktop"
crate-type = ["rlib"]

[[bin]]
name = "choiterm-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
